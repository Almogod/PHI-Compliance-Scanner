[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phi-scanner"
version = "0.1.0"
description = "Local-only PII/PHI compliance scanner for Indian identifiers (DPDP Act)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "presidio-analyzer>=2.2",
]

[project.scripts]
scan = "phi_scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phi_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
