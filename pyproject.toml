[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-scanner"
version = "0.1.0"
description = "Local-only PII/PHI compliance scanner for Indian identifiers (DPDP Act)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "presidio-analyzer>=2.2",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
]

[project.scripts]
scan = "phi_scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
