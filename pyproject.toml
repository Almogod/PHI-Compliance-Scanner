[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-scanner"
version = "4.0.0"
description = "Local-only PII/PHI compliance scanner for Indian identifiers (DPDP Act)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "click>=8.1,<9",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1.0,<2",
    "pypdf>=4.0.0,<5",
    # cryptography is optional at runtime but required for --encrypt flag.
    # Bundle wheels/ dir for air-gapped environments.
    "cryptography>=42.0,<43",
]

[project.scripts]
scan = "phi_scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "pre-commit>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# mypy — strict static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "presidio_analyzer.*", "docx.*", "pypdf.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E402",  # module level import not at top (needed for adapter pattern in recognizers)
    "N999",  # invalid module name (legacy naming)
]

[tool.ruff.lint.isort]
known-first-party = ["phi_scanner"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
